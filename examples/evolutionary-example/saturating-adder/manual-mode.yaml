max_iterations: 1
checkpoint_interval: 1
random_seed: 42
diff_based_evolution: true
llm:
  manual_mode: true
  models:
    - name: existing-agent-session
      weight: 1.0
  retries: 0
  timeout: 120
  max_tokens: 1800
prompt:
  system_message:
    Repair the unsigned 4-bit saturating_adder. Preserve module name
    and ports a[3:0], b[3:0], sum[3:0]. Output sum=min(a+b,15). Use synthesizable
    combinational SystemVerilog. Change only the EVOLVE-BLOCK implementation, not
    the interface, testbench, scorer or tools. Respond using requested SEARCH/REPLACE
    diff format.
database:
  num_islands: 1
  population_size: 8
  archive_size: 4
evaluator:
  parallel_evaluations: 1
  max_retries: 0
  cascade_evaluation: false
  use_llm_feedback: false
