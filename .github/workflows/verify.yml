name: ChipSim source and MCP
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils iverilog ghdl yosys
      - run: npm ci && npm ci --prefix extensions/mcp
      - run: npm run verify
      - run: npm run test:mcp
        env:
          CHIPSIM_TEST_BENCHMARK: "1"
      - run: npm run test:install
      - run: npm run test:mcp:installed
